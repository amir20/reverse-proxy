# Owns TCP :443. Terminates only the Dozzle agent hostname, where about 1,800
# long-lived gRPC connections cost Traefik ~450 MiB. Every other hostname is
# passed through untouched, so Traefik keeps its routes and certificates.
global
    maxconn 20000
    log stdout format raw local0 warning
    stats socket /tmp/haproxy.sock mode 600 level admin

resolvers docker
    nameserver dns 127.0.0.11:53

defaults
    log global
    timeout connect 5s
    # Traefik runs with no idle timeouts; these are long enough to never cut
    # a quiet ToolStream or WebSocket in practice.
    timeout client 24h
    timeout server 24h
    timeout tunnel 24h

frontend sni
    mode tcp
    bind [::]:443 v4v6
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    # Traefik still issues the agent certificate, so it must answer the challenge.
    use_backend traefik_tcp if { req.ssl_alpn acme-tls/1 }
    use_backend agent_loop if { req.ssl_sni -i agent.doligence.dozzle.dev }
    default_backend traefik_tcp

backend traefik_tcp
    mode tcp
    server traefik traefik:443 send-proxy-v2 resolvers docker init-addr last,libc,none

backend agent_loop
    mode tcp
    server local abns@agent send-proxy-v2

frontend agent
    mode http
    bind abns@agent accept-proxy ssl crt /certs/agent.pem alpn h2,http/1.1
    default_backend api_grpc

backend api_grpc
    mode http
    # Without this each client gets its own connection to the API.
    http-reuse always
    server api doligence_api:8082 proto h2 resolvers docker init-addr last,libc,none
